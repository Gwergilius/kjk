<body>
  <h3 class="sgc-1" id="heading_id_123">122.</h3>

  <div class="sgc-1">
    Elfogadják a rubinkövet és hangos horkantások közepette hajlongva mutatják ki nagyrabecsülésüket. Barátságosan taszigálnak a falujuk felé. Ha megköszönöd, de elhárítod a szíves invitálást - <a class="sgc-2" href="../Text/1_0014.xhtml">lapozz a 14-re</a>. Ha elkíséred őket a faluba - <a class="sgc-2" href="../Text/1_0072.xhtml">lapozz a 72-re</a>.
  </div>
