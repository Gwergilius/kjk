  <h3 class="sgc-1" id="heading_id_13">12.</h3>

  <div class="sgc-1">
    Első csapásod végzetes. Vér bugyog a tátongó sebből, az Öreg a földre rogy. Hátralépsz, amint újra felölti eredeti Vörös Sárkány alakját. A Kapukat Őrző Sárkány halott. Elindulsz a csillogó ezüstkapu felé. <a class="sgc-2" href="../Text/1_0400.xhtml">Lapozz a 400-ra</a>.
  </div>
