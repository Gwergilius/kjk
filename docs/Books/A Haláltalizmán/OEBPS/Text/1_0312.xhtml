  <h3 class="sgc-1" id="heading_id_313">312.</h3>

  <div class="sgc-1">
    Sajnos a tolvajok meghallották. A legfiatalabb egy falikárpit mögé rejtőzve hangtalanul mögéd oson. Izzó fájdalom hasít a hátadba. Mérgezett tőrrel szúrt le. A földre rogysz, képtelen vagy megmozdulni. Az ifjú tolvaj közömbösen elveszi a pénzeszacskódat. <a class="sgc-2" href="../Text/1_0109.xhtml">Lapozz a 109-re</a>.
  </div>
