<body>
  <h3 class="sgc-1" id="heading_id_112">111.</h3>

  <div class="sgc-1">
    Az Orkok, amikor látják, hogy egymagad legyőzted a vezérüket, hanyatt-homlok menekülni kezdenek. Te a domb túlsó oldalán futsz le. Alattad mély, páfrányok borította völgy terül el. Úgy döntesz, hogy arra mész tovább, hátha elkerülöd az Elfeket. <a class="sgc-2" href="../Text/1_0203.xhtml">Lapozz a 203-ra</a>.
  </div>
