  <h3 class="sgc-1" id="heading_id_334">333.</h3>

  <div class="sgc-1">
    - Megőrültél? Nincs az a pénz, amiért én kirabolnám Fell-Kyrinla templomát - válaszolja Vagrant. - Ha beszélsz nekik a Haláltalizmánról - <a class="sgc-2" href="../Text/1_0276.xhtml">lapozz a 276-ra</a>. Ha inkább blöffölsz és azt mondod, majd találsz mást, akivel megoszthatod a zsákmányt - <a class="sgc-2" href="../Text/1_0367.xhtml">lapozz a 367-re</a>.
  </div>

  <div class="sgc-1"></div>
