  <h3 class="sgc-1" id="heading_id_243">242.</h3>

  <div class="sgc-1">
    Feléd indulnak. Az egyik íjpuskát vesz elő és lő. Lebuksz előle, de a lábadra célzott, a nyílvessző a combodba fúródik, s az oldaladra dőlsz. Úgy érzed, mintha lángolna a véred. A nyílvessző mérgezett volt. Hamarosan meghalsz. <a class="sgc-2" href="../Text/1_0109.xhtml">Lapozz a 109-re</a>.
  </div>
