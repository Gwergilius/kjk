  <h3 class="sgc-1" id="heading_id_296">295.</h3>

  <div class="sgc-1">
    - Én elmondtam, de ez hat aranyadba fog kerülni, egy ezüsttel sem kevesebbe - feleli a csapos. - Ha van ennyi pénzed és fizetsz - <a class="sgc-2" href="../Text/1_0323.xhtml">lapozz a 323-ra</a>. Ha nincs ennyi pénzed, vagy nem akarsz fizetni - <a class="sgc-2" href="../Text/1_0312.xhtml">lapozz a 312-re</a>.
  </div>
