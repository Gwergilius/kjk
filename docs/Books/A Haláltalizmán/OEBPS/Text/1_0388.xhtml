  <h3 class="sgc-1" id="heading_id_389">388.</h3>

  <div class="sgc-1">
    Ügyet sem vetnek a fenyegetésedre és a tűzön át feléd ösztökélik lovaikat. A lángok közé veted a Talizmánt, de semmi sem történik. Az egyik kísértet kiveszi az izzó parázsból és megérint vele. Lelkedet beszívja a Talizmán, tested pedig szétporlik. Most már csak a Talizmán része vagy.
  </div>
