  <h3 class="sgc-1" id="heading_id_95">94.</h3>

  <div class="sgc-1">
    Legyőzted a Griffet. Az mélyen meghajol előtted, és legnagyobb meglepetésedre megszólal - Kegyelmezz, és én cserébe oda viszlek, ahová csak akarod. - Azt mondod, hogy vigyen a fennsíkra - <a class="sgc-2" href="../Text/1_0086.xhtml">lapozz a 86-ra</a>. Ha ott hagyod és elindulsz gyalog délkeletnek - <a class="sgc-2" href="../Text/1_0287.xhtml">lapozz a 287-re</a>.
  </div>

  <div class="sgc-1"></div>
