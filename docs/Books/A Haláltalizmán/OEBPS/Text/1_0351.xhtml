<body>
  <h3 class="sgc-1" id="heading_id_352">351.</h3>

  <div class="sgc-1">
    Végigvisznek az Ingoványi kapu utcán, különböző élelmiszer- és fazekasüzletek előtt, azután a nyüzsgő Raktár utcán. Ott jobbra kanyarodtok az Őr utcára és megálltok egy szürke, zömök épület előtt. Ez az őrség épülete. Az őrök leszállnak a lóról és bevezetnek. <a class="sgc-2" href="../Text/1_0078.xhtml">Lapozz a 78-ra</a>.
  </div>
