<body>
  <h3 class="sgc-1" id="heading_id_368">367.</h3>

  <div class="sgc-1">
    - Akkor sok szerencsét hozzá! - mondja a Sebhelyes. A tolvajok még mindig rád szegezik az íjpuskáikat. Vagrant távozik és úgy döntesz, okosabb lesz, ha te is elmész. Nincs más választásod, egyedül kell megbirkóznod Fell-Kyrinla templomával. Elindulsz, hogy megkeresd. <a class="sgc-2" href="../Text/1_0383.xhtml">Lapozz a 383-ra</a>.
  </div>

  <div class="sgc-1"></div>
