  <h3 class="sgc-1" id="heading_id_113">112.</h3>

  <div class="sgc-1">
    A szél a pajzsod alá fúj, kirántja a kezedből, és legnagyobb rémületedre a szakadékba sodorja. A Sárkány felnevet és nagyot fúj rád. Terjedelmes tüdejéből hatalmas lángok csapnak ki. Pusztító erejű tűz vesz körül és szénné égsz! <a class="sgc-2" href="../Text/1_0043.xhtml">Lapozz a 43-ra</a>.
  </div>
