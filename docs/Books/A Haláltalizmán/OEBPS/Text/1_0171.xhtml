  <h3 class="sgc-1" id="heading_id_172">171.</h3>

  <div class="sgc-1">
    Míg Tyucsev kardot ránt, Thaum rád mutat. Ujjából színes tűzgolyó száll feléd. Ha megpróbálod elkerülni a tűzgolyót és ráveted magad Tyucsevre - <a class="sgc-2" href="../Text/1_0244.xhtml">lapozz a 244-re</a>. Ha nem mozdulsz - <a class="sgc-2" href="../Text/1_0225.xhtml">lapozz a 225-re</a>.
  </div>
