  <h3 class="sgc-1" id="heading_id_181">180.</h3>

  <div class="sgc-1">
    Négyesével szeded a lépcsőket. Mikor egy újabb fordulóhoz érsz, lentről léptek zaját hallod. Hirtelen ötlettel egy függöny mögé bújsz. Tedd próbára a SZERENCSÉDET. Ha SZERENCSÉD van - <a class="sgc-2" href="../Text/1_0140.xhtml">lapozz a 140-re</a>. Ha nincs SZERENCSÉD - <a class="sgc-2" href="../Text/1_0153.xhtml">lapozz a 153-ra</a>.
  </div>

  <div class="sgc-1"></div>
