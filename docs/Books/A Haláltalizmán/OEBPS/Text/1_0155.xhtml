  <h3 class="sgc-1" id="heading_id_156">155.</h3>

  <div class="sgc-1">
    Elvira segít felülni. Egyáltalán nem látszik boldognak, hogy meg kell osztania veled a lovát. Csöndben lovagoltok keresztül a síkságon. Vesztesz 2 ÜGYESSÉG pontot, amíg nem teszel szert egy másik kardra. <a class="sgc-2" href="../Text/1_0157.xhtml">Lapozz a 257-re</a>.
  </div>
