<body>
  <h3 class="sgc-1" id="heading_id_27">26.</h3>

  <div class="sgc-1">
    Kardod egyetlen hatalmas sújtásával kettévágod a Fűz egyik ágát, amelyből a fa nedve a karodra csöppen. A Fűz halk nyögéssel abbahagyja a támadást, és visszahúzza az ágait. Ha belemártod a karodat a tóba - <a class="sgc-2" href="../Text/1_0161.xhtml">lapozz a 161-re</a>. Ha gyorsan visszavonulsz - <a class="sgc-2" href="../Text/1_0039.xhtml">lapozz a 39-re</a>.
  </div>

  <div class="sgc-1"></div>
