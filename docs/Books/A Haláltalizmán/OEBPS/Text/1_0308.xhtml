  <h3 class="sgc-1" id="heading_id_309">308.</h3>

  <div class="sgc-1">
    Épp időben lapulsz a sziklafalhoz. A kövek lezúdulnak melletted és nem sokkal alattad csattannak a lépcsőkön. Óvatosan folytatod az utadat fölfelé a lépcsőkön. <a class="sgc-2" href="../Text/1_0192.xhtml">Lapozz a 192-re</a>.
  </div>
