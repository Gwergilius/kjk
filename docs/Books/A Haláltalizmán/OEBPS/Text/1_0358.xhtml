  <h3 class="sgc-1" id="heading_id_359">358.</h3>

  <div class="sgc-1">
    Lágy hangját feléd hozza a szél: - Én semmit sem tudok a Halálról; ő nem érhet el. Én az őr vagyok, akit az Istenek helyeztek ide; sem több, sem kevesebb. Ha beszélsz neki a Talizmánról és fontosságáról - <a class="sgc-2" href="../Text/1_0211.xhtml">lapozz a 211-re</a>. Ha megtámadod a Sárkányt - <a class="sgc-2" href="../Text/1_0382.xhtml">lapozz a 382-re</a>.
  </div>

  <div class="sgc-1"></div>
