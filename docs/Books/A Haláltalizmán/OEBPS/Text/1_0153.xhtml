  <h3 class="sgc-1" id="heading_id_154">153.</h3>

  <div class="sgc-1">
    Rémülten veszed észre, hogy a lábad kilóg a függöny mögül. Amilyen gyorsan csak tudod, visszahúzod, de a léptek zaja épp előtted hal el. Női hang szólal meg: - Á! A patkány, egy ezüstért hal meg! - A függönyön keresztül a hasadba döfi a kardját. Pillanatokon belül meghalsz. <a class="sgc-2" href="../Text/1_0109.xhtml">Lapozz a 109-re</a>.
  </div>

  <div class="sgc-1"></div>
