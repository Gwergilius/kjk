  <h3 class="sgc-1" id="heading_id_394">393.</h3>

  <div class="sgc-1">
    A Kapitány élve akar elfogni, ezért közelebb lép és pajzsával a kardforgató kezedre sújt. Mielőtt újra támadhatnál, kardja markolatával oldalról a nyakadra vág és te ájultan esel össze. Hátrakötik a kezeidet és Újra elindultok. <a class="sgc-2" href="../Text/1_0351.xhtml">Lapozz a 351-re</a>.
  </div>
