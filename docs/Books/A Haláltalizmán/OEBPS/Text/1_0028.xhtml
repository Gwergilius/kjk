  <h3 class="sgc-1" id="heading_id_29">28.</h3>

  <div class="sgc-1">
    Befordulsz a Kocsi utcába és egy cégért veszel észre: Fogadó az Ezüst Mütyürhöz. Közvetlenül egy nagy istálló és egy szegényház mellett áll. Sokkal kellemesebb helynek látszik, mint a Vörös Sárkány Fogadó. Már erősen sötétedik, ezért úgy döntesz, hogy betérsz. <a class="sgc-2" href="../Text/1_0015.xhtml">Lapozz a 15-re</a>.
  </div>
