  <h3 class="sgc-1" id="heading_id_343">342.</h3>

  <div class="sgc-1">
    Tyucsev közétek lép. Kardja majdnem akkora, mint te magad, de ő csak lazán fél kézzel fogja. Kasszandra hátralép, kezét karba fonja. - Nehéz harcod lesz, Tyucsev! - lihegi.
  </div>

  <div class="sgc-1">
    <br />
  </div>

  <div class="sgc-1">
    <i>Tyucsev</i>&nbsp;&nbsp; ÜGYESSÉG 10 &nbsp; ÉLETERŐ 12
  </div>

  <div class="sgc-1">
    <br />
  </div>

  <div class="sgc-1">
    Ha Tyucsev ÉLETEREJÉT 4-re vagy az alá csökkented, <a class="sgc-2" href="../Text/1_0355.xhtml">lapozz a 355-re</a>.
  </div>
