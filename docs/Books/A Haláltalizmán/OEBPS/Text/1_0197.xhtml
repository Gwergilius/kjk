  <h3 class="sgc-1" id="heading_id_198">197.</h3>

  <div class="sgc-1">
    Hirtelen a Kapitány hangja harsan fel mögötted; - Vigyázzatok! Rajtaütés! Hasra! - Nyílvessző süvítését hallod. Elvira lebukik előtted. Ha te is lehasalsz - <a class="sgc-2" href="../Text/1_0240.xhtml">lapozz a 240-re</a>. Ha vársz, mi történik, <a class="sgc-2" href="../Text/1_0224.xhtml">lapozz a 224-re</a>.
