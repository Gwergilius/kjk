  <h3 class="sgc-1" id="heading_id_18">17.</h3>

  <div class="sgc-1">
    Amint a boltíves folyosó vészjósló sötétje felé rohansz, egy kattanást hallasz, amit félelmetes robaj követ. A lábad alatt megremeg a föld. Ha a boltíven át beleveted magad a sötétbe - <a class="sgc-2" href="../Text/1_0041.xhtml">lapozz a 41-re</a>. Ha megtorpansz - <a class="sgc-2" href="../Text/1_0021.xhtml">lapozz a 21-re</a>.
  </div>
